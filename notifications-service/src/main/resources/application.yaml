spring:
  application:
    name: notifications-service

  profiles:
    active: dev

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notifications
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: "com.bistro.*"
        spring.json.type.mapping: >
          com.bistro.reservations.events.ReservationConfirmedV2:com.bistro.notifications.events.ReservationConfirmedV2,
          com.bistro.reservations.events.ReservationRejected:com.bistro.notifications.events.ReservationRejected,
          com.bistro.reservations.events.ReservationCancelled:com.bistro.notifications.events.ReservationCancelled
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

server:
  port: 8081

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_URL:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        url: ${OTLP_URL:http://localhost:4318}/v1/metrics

---
spring:
  config:
    activate:
      on-profile: dev
  mail:
    host: localhost
    port: 1025

logging:
  level:
    com.bistro: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

logging:
  level:
    com.bistro: INFO